<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tarnished Ledger</title>
<style>
:root{
  --ground:#E6E5DC; --surface:#F2F1EA; --ink:#23251F; --ink-2:#4E5147; --muted:#767A6C;
  --rule:#C9C8BB; --rule-soft:#D6D5C9;
  --gold:#8A6D12; --gold-bright:#B08D1E; --gold-wash:#EFE7C9;
  --shade:#5A4A7C; --shade-wash:#E6E1EF;
  --warn:#8C2F26; --warn-wash:#F3E2DF;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#171714; --surface:#201F1C; --ink:#E8E5D8; --ink-2:#BDBAAC; --muted:#8D8A7D;
  --rule:#35342E; --rule-soft:#2C2B26;
  --gold:#D6B34C; --gold-bright:#E8C765; --gold-wash:#302A18;
  --shade:#A695CE; --shade-wash:#252036;
  --warn:#D8776B; --warn-wash:#33201D;
}}
:root[data-theme="dark"]{
  --ground:#171714; --surface:#201F1C; --ink:#E8E5D8; --ink-2:#BDBAAC; --muted:#8D8A7D;
  --rule:#35342E; --rule-soft:#2C2B26;
  --gold:#D6B34C; --gold-bright:#E8C765; --gold-wash:#302A18;
  --shade:#A695CE; --shade-wash:#252036;
  --warn:#D8776B; --warn-wash:#33201D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

.bar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1400px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;white-space:nowrap}
.spacer{flex:1 1 30px}
.ringwrap{display:flex;align-items:center;gap:10px}
.ring{width:42px;height:42px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:var(--rule)}
.ring .val{stroke:var(--gold-bright);stroke-linecap:round;transition:stroke-dashoffset .3s}
.pct{font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tal{font-size:11px;color:var(--muted);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:13px;color:var(--ink-2);background:var(--ground);
  border:1px solid var(--rule);border-radius:2px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--gold)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
select{font:inherit;font-size:13px;background:var(--ground);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;padding:6px 8px;max-width:210px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg .btn{border:0;border-right:1px solid var(--rule);border-radius:0}
.seg .btn:last-child{border-right:0}
.search{display:flex;align-items:center;gap:6px;background:var(--ground);
  border:1px solid var(--rule);border-radius:2px;padding:5px 9px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;width:200px;outline:none}

.shell{max-width:1400px;margin:0 auto;padding:0 20px 80px;display:flex;gap:32px;align-items:flex-start}
.rail{position:sticky;top:72px;flex:0 0 216px;padding:22px 0;max-height:calc(100vh - 88px);overflow-y:auto}
.rail h2{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);
  margin:0 0 9px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.rail a{display:block;text-decoration:none;color:var(--ink-2);padding:6px 0;font-size:13px;
  border-bottom:1px solid var(--rule-soft)}
.rail a:hover{color:var(--gold)}
.rail a.done{color:var(--gold);font-weight:600}
.rl{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rn{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rbar{height:2px;background:var(--rule);margin-top:5px;position:relative}
.rbar i{position:absolute;inset:0 auto 0 0;background:var(--gold-bright);transition:width .3s}
.main{flex:1 1 auto;min-width:0;padding:22px 0}

.sec{margin:0 0 30px;scroll-margin-top:84px}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:8px;
  border-bottom:1px solid var(--rule)}
.sec-h h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:0}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt b{color:var(--gold)}
.note{color:var(--muted);font-size:13px;margin:8px 0 0;max-width:72ch}
.fil{height:3px;background:var(--rule);position:relative;margin:10px 0 18px}
.fil i{position:absolute;inset:0 auto 0 0;background:var(--gold-bright);transition:width .3s}

.grp{margin:0 0 20px}
.grp-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px;
  text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);padding-bottom:7px;
  margin-bottom:8px;border-bottom:1px solid var(--rule-soft)}
.gn{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0;margin-left:auto;
  font-variant-numeric:tabular-nums}
.chip{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;
  border-radius:2px;font-weight:600}
.chip.dlc{background:var(--shade-wash);color:var(--shade);border:1px solid var(--shade)}
.chip.x{background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn)}
.chip.runs{background:var(--gold-wash);color:var(--gold);border:1px solid var(--gold);
  letter-spacing:.04em;margin-left:6px;vertical-align:1px}
.chip.auto{background:transparent;color:var(--muted);border:1px dashed var(--rule);
  letter-spacing:.04em;margin-left:6px;vertical-align:1px;font-weight:500}

/* Derived entries: computed from a prerequisite, never ticked by hand. */
.item[data-derived] label{cursor:default}
.item[data-derived] label:hover{background:transparent}
.item[data-derived] input[type=checkbox]{
  cursor:default;border-style:dashed;opacity:.75}
.item[data-derived] input:checked{opacity:1;border-style:solid}
.item[data-derived] .tx{color:var(--muted)}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1px 22px;
  list-style:none;padding:0;margin:0}
.items.wide{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
.item label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:4px 6px 4px 2px;border-radius:2px}
.item label:hover{background:var(--surface)}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:14px;height:14px;
  margin:4px 0 0;border:1px solid var(--muted);border-radius:1px;background:var(--surface);
  cursor:pointer;position:relative}
.item input:checked{background:var(--gold-bright);border-color:var(--gold-bright)}
.item input:checked::after{content:"";position:absolute;left:4px;top:1px;width:3px;height:7px;
  border:solid var(--ground);border-width:0 2px 2px 0;transform:rotate(42deg)}
.tx{min-width:0;font-size:14px;line-height:1.45}
.d{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:1px}
.item input:checked ~ .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.item input:checked ~ .tx .d{text-decoration:none}

.ctr{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--surface);
  border:1px solid var(--rule);border-radius:2px}
.ctr.full{border-color:var(--gold);background:var(--gold-wash)}
.ctr .cn{flex:1 1 auto;min-width:0;font-size:14px}
.ctr .num{font-family:var(--mono);font-size:14px;min-width:58px;text-align:right;
  color:var(--ink-2);font-variant-numeric:tabular-nums}
.ctr .num b{color:var(--gold)}
.ctr button{font:inherit;width:26px;height:26px;flex:none;line-height:1;background:var(--ground);
  border:1px solid var(--rule);border-radius:2px;color:var(--ink-2);cursor:pointer;font-size:15px}
.ctr button:hover{border-color:var(--gold);color:var(--gold)}

.panel{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--gold);
  padding:18px 22px;margin:0 0 26px}
.panel h3{font-family:var(--serif);font-size:18px;margin:0 0 6px;font-weight:600}
.panel p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px;max-width:70ch}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hidden{display:none !important}
.msg{color:var(--muted);font-size:14px;padding:36px 0;font-style:italic}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--ground);padding:9px 16px;border-radius:2px;font-size:13px;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:940px){
  .shell{display:block}
  .rail{position:static;width:auto;flex:none;max-height:none;padding:16px 0 0;display:flex;
    gap:8px;overflow-x:auto;border-bottom:1px solid var(--rule)}
  .rail h2{display:none}
  .rail a{white-space:nowrap;border:1px solid var(--rule);border-radius:2px;padding:6px 10px;font-size:12px}
  .rbar{display:none}
  .search input{width:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <h1 class="brand">The Tarnished Ledger</h1>
  <div class="ringwrap">
    <svg class="ring" viewBox="0 0 42 42" aria-hidden="true">
      <circle class="trk" cx="21" cy="21" r="17"></circle>
      <circle class="val" id="ring" cx="21" cy="21" r="17" stroke-dasharray="106.8" stroke-dashoffset="106.8"></circle>
    </svg>
    <div><div class="pct" id="pct">0%</div><div class="tal" id="tally">0 / 0</div></div>
  </div>
  <div class="spacer"></div>
  <label class="tal" for="prof">Run</label>
  <select id="prof" aria-label="Active run"></select>
  <button class="btn" id="newrun">New run</button>
  <div class="search">
    <input id="q" type="search" placeholder="Search 1,672 entries…" aria-label="Search">
  </div>
  <div class="seg" role="group" aria-label="Content filter">
    <button class="btn" data-mode="all" aria-pressed="true">All</button>
    <button class="btn" data-mode="base" aria-pressed="false">Base</button>
    <button class="btn" data-mode="dlc" aria-pressed="false">DLC</button>
  </div>
  <button class="btn" id="hide" aria-pressed="false">Hide done</button>
  <button class="btn" id="cov" aria-pressed="false">All runs</button>
  <button class="btn" id="menu">More</button>
</div></div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"><h2>Sections</h2></nav>
  <main class="main">
    <section class="panel hidden" id="more">
      <h3>This run</h3>
      <p id="moretext"></p>
      <div class="row">
        <button class="btn" id="rename">Rename run</button>
        <button class="btn" id="export">Export JSON</button>
        <button class="btn" id="import">Import JSON</button>
        <button class="btn" id="reset">Clear this run</button>
        <button class="btn" id="delrun">Delete run</button>
      </div>
    </section>
    <section class="panel hidden" id="covpanel">
      <h3>Across every run</h3>
      <p id="covtext"></p>
    </section>
    <div id="out"></div>
    <p class="msg hidden" id="none">Nothing matches.</p>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const api = async (p, opt) => {
  const r = await fetch(p, opt);
  const j = await r.json().catch(() => ({error:"bad response"}));
  if (j.error) { toast(j.error); throw new Error(j.error); }
  return j;
};
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }

let PID = null, SECTIONS = [], MODE = "all", HIDE = false, COV = false, Q = "";
let COVMAP = {};   // item_id -> finished in any run

/* ---------------- render ---------------- */
function render(){
  let rail = '<h2>Sections</h2>', html = "";
  for (const s of SECTIONS){
    rail += `<a href="#s-${s.slug}" data-rail="${s.slug}"><span class="rl">
      <span>${esc(s.title)}</span><span class="rn" data-rn="${s.slug}"></span></span>
      <span class="rbar"><i data-rb="${s.slug}"></i></span></a>`;
    let body = "";
    for (const g of s.groups){
      const chips = (g.dlc ? '<span class="chip dlc">Shadow of the Erdtree</span>' : "")
                  + (g.choice ? '<span class="chip x">choice</span>' : "");
      const wide = s.slug === "quest";
      let lis = "";
      for (const it of g.items){
        const hay = (it.name + " " + it.detail).toLowerCase();
        const base = `class="item" data-id="${it.id}" data-dlc="${g.dlc}" data-s="${esc(hay)}" data-target="${it.target}"`;
        if (it.kind === "tally"){
          lis += `<li ${base} data-kind="tally"><div class="ctr${it.value>=it.target?" full":""}">
            <button type="button" data-step="-1" data-id="${it.id}" aria-label="Decrease ${esc(it.name)}">−</button>
            <button type="button" data-step="1" data-id="${it.id}" aria-label="Increase ${esc(it.name)}">+</button>
            <span class="cn">${esc(it.name)}${it.detail?`<span class="d">${esc(it.detail)}</span>`:""}</span>
            <span class="num"><b>${it.value}</b> / ${it.target}</span></div></li>`;
        } else {
          const auto = it.derived
            ? `<span class="chip auto" title="Computed from ${esc(it.from)} — tick that instead">auto</span>`
            : "";
          const det = it.derived
            ? `<span class="d">Automatic: ${esc(it.from)}${it.detail?" · "+esc(it.detail):""}</span>`
            : (it.detail?`<span class="d">${esc(it.detail)}</span>`:"");
          lis += `<li ${base}${it.derived?' data-derived="1"':""} data-kind="check"><label>
            <input type="checkbox" data-id="${it.id}"${it.value?" checked":""}${it.derived?" disabled":""}>
            <span class="tx">${esc(it.name)}${auto}${runsChip(it)}${det}</span>
            </label></li>`;
        }
      }
      body += `<div class="grp"><div class="grp-h"><span>${esc(g.name)}</span>${chips}
        <span class="gn" data-gid="${g.id}"></span></div>
        <ul class="items${wide?" wide":""}">${lis}</ul></div>`;
    }
    html += `<section class="sec" id="s-${s.slug}" data-slug="${s.slug}">
      <div class="sec-h"><h2>${esc(s.title)}</h2><span class="cnt" data-cnt="${s.slug}"></span></div>
      ${s.note?`<p class="note">${esc(s.note)}</p>`:""}
      <div class="fil"><i data-fil="${s.slug}"></i></div>${body}</section>`;
  }
  $("#rail").innerHTML = rail;
  $("#out").innerHTML = html;
  recount();
  applyFilters();
}

function runsChip(it){
  return (it.runs > 1) ? `<span class="chip runs">${it.runs} runs</span>` : "";
}

/* client-side recount so ticking feels instant */
function recount(){
  let gd=0, gt=0;
  for (const sec of document.querySelectorAll(".sec")){
    let d=0, t=0;
    for (const li of sec.querySelectorAll(".item")){
      const target = +li.dataset.target;
      t += target;
      d += li.dataset.kind === "tally"
        ? +li.querySelector(".num b").textContent
        : (li.querySelector("input").checked ? target : 0);
    }
    gd+=d; gt+=t;
    const slug = sec.dataset.slug, p = t ? d/t : 0;
    sec.querySelector(`[data-cnt="${slug}"]`).innerHTML = `<b>${d}</b> / ${t}`;
    sec.querySelector(`[data-fil="${slug}"]`).style.width = (p*100).toFixed(1)+"%";
    const rn=$(`[data-rn="${slug}"]`), rb=$(`[data-rb="${slug}"]`),
          lk=$(`[data-rail="${slug}"]`);
    if(rn) rn.textContent = Math.round(p*100)+"%";
    if(rb) rb.style.width = (p*100).toFixed(1)+"%";
    if(lk) lk.classList.toggle("done", d===t && t>0);
    for (const grp of sec.querySelectorAll(".grp")){
      let a=0,b=0;
      for (const li of grp.querySelectorAll(".item")){
        const target=+li.dataset.target; b+=target;
        a += li.dataset.kind==="tally"
          ? +li.querySelector(".num b").textContent
          : (li.querySelector("input").checked ? target : 0);
      }
      grp.querySelector(".gn").textContent = `${a}/${b}`;
    }
  }
  const pct = gt ? gd/gt : 0;
  $("#pct").textContent = (pct*100).toFixed(1)+"%";
  $("#tally").textContent = `${gd} / ${gt}`;
  $("#ring").style.strokeDashoffset = (2*Math.PI*17*(1-pct)).toFixed(2);
}

/* ---------------- filters ---------------- */
function applyFilters(){
  let any=false;
  for (const sec of document.querySelectorAll(".sec")){
    let sv=false;
    for (const grp of sec.querySelectorAll(".grp")){
      let gv=false;
      for (const li of grp.querySelectorAll(".item")){
        const dlc = li.dataset.dlc === "1";
        const done = li.dataset.kind==="tally"
          ? +li.querySelector(".num b").textContent >= +li.dataset.target
          : li.querySelector("input").checked;
        let ok = true;
        if (MODE==="base" && dlc) ok=false;
        if (MODE==="dlc" && !dlc) ok=false;
        if (ok && HIDE && done) ok=false;
        if (ok && COV && COVMAP[li.dataset.id]) ok=false;
        if (ok && Q && !li.dataset.s.includes(Q)) ok=false;
        li.classList.toggle("hidden", !ok);
        if (ok) gv=true;
      }
      grp.classList.toggle("hidden", !gv);
      if (gv) sv=true;
    }
    sec.classList.toggle("hidden", !sv);
    if (sv) any=true;
    const lk=$(`[data-rail="${sec.dataset.slug}"]`);
    if (lk) lk.classList.toggle("hidden", !sv);
  }
  $("#none").classList.toggle("hidden", any);
}

/* ---------------- writes ---------------- */
async function setVal(id, value){
  const j = await api("/api/set", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({profile:PID, item:id, value})});
  if (j.derived) applyDerived(j.derived);
  return j.value;
}

// Repaint the computed entries a write just settled (or un-settled).
function applyDerived(map){
  for (const [id, v] of Object.entries(map)){
    const li = document.querySelector(`.item[data-id="${id}"]`);
    if (!li) continue;
    const box = li.querySelector('input[type="checkbox"]');
    if (box) box.checked = v > 0;
  }
}

document.addEventListener("change", async e => {
  const box = e.target.closest('input[type="checkbox"][data-id]');
  if (!box) return;
  const li = box.closest(".item");
  try { await setVal(+box.dataset.id, box.checked ? +li.dataset.target : 0); }
  catch { box.checked = !box.checked; }
  recount(); applyFilters();
});

document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-step]");
  if (!b) return;
  const li = b.closest(".item"), numB = li.querySelector(".num b");
  const target = +li.dataset.target;
  const next = Math.max(0, Math.min(target, +numB.textContent + (+b.dataset.step)));
  if (next === +numB.textContent) return;
  const prev = numB.textContent;
  numB.textContent = next;
  li.querySelector(".ctr").classList.toggle("full", next >= target);
  recount(); applyFilters();
  try { await setVal(+b.dataset.id, next); }
  catch { numB.textContent = prev; recount(); applyFilters(); }
});

/* ---------------- profiles ---------------- */
async function loadProfiles(sel){
  const {profiles} = await api("/api/profiles");
  const s = $("#prof");
  s.innerHTML = profiles.map(p =>
    `<option value="${p.id}"${p.id===sel?" selected":""}>${esc(p.name)} — ${p.done}/${p.total}</option>`
  ).join("");
  PID = sel ?? +s.value;
  const cur = profiles.find(p => p.id === PID);
  if (cur) $("#moretext").textContent =
    `${cur.name} — started ${cur.created_at}. ${cur.done} of ${cur.total} units done.` +
    (cur.note ? ` (${cur.note})` : "");
  return profiles;
}

async function loadTree(){
  const j = await api("/api/tree?profile=" + PID);
  SECTIONS = j.sections;
  render();
}

$("#prof").addEventListener("change", async e => {
  PID = +e.target.value;
  localStorage.setItem("er-pid", PID);
  await loadProfiles(PID); await loadTree();
  if (COV) await loadCoverage();
});

$("#newrun").addEventListener("click", async () => {
  const name = prompt("Name this run (e.g. \"NG+ — Frenzied Flame\")");
  if (!name) return;
  const j = await api("/api/profiles", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({name})});
  PID = j.id; localStorage.setItem("er-pid", PID);
  await loadProfiles(PID); await loadTree(); toast("Run created");
});

$("#rename").addEventListener("click", async () => {
  const name = prompt("New name for this run");
  if (!name) return;
  await api("/api/profiles/rename", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({profile:PID, name})});
  await loadProfiles(PID); toast("Renamed");
});

$("#delrun").addEventListener("click", async () => {
  if (!confirm("Delete this run and all its progress? This cannot be undone.")) return;
  const j = await api("/api/profiles/delete", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({profile:PID})});
  PID = j.profiles[0].id; localStorage.setItem("er-pid", PID);
  await loadProfiles(PID); await loadTree(); toast("Run deleted");
});

$("#reset").addEventListener("click", async () => {
  if (!confirm("Clear every tick in this run? The run itself stays.")) return;
  await api("/api/reset", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({profile:PID})});
  await loadProfiles(PID); await loadTree(); toast("Run cleared");
});

$("#export").addEventListener("click", async () => {
  const j = await api("/api/export?profile=" + PID);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(j, null, 1)], {type:"application/json"}));
  a.download = `elden-ring-${j.profile.replace(/\W+/g,"-").toLowerCase()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
});

$("#import").addEventListener("click", () => {
  const f = document.createElement("input");
  f.type = "file"; f.accept = ".json,application/json";
  f.onchange = () => {
    const file = f.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        const j = await api("/api/import", {method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({profile:PID, progress:d.progress || []})});
        await loadProfiles(PID); await loadTree();
        toast(`Imported ${j.imported} entries`);
      } catch { toast("That file isn't a ledger export"); }
    };
    r.readAsText(file);
  };
  f.click();
});

/* ---------------- coverage ---------------- */
async function loadCoverage(){
  const j = await api("/api/coverage");
  COVMAP = {};
  const missing = new Set(j.missing.map(m => m.item_id));
  for (const s of SECTIONS) for (const g of s.groups) for (const it of g.items)
    COVMAP[it.id] = !missing.has(it.id);
  const pct = j.total ? (100*j.done/j.total).toFixed(1) : "0";
  $("#covtext").textContent =
    `${j.done} of ${j.total} units (${pct}%) are finished in at least one run. ` +
    `${j.missing.length} entries have never been finished in any run — those are what's ` +
    `showing below.`;
}

$("#cov").addEventListener("click", async () => {
  COV = !COV;
  $("#cov").setAttribute("aria-pressed", String(COV));
  $("#covpanel").classList.toggle("hidden", !COV);
  if (COV) await loadCoverage();
  applyFilters();
});

/* ---------------- misc controls ---------------- */
$("#q").addEventListener("input", e => { Q = e.target.value.trim().toLowerCase(); applyFilters(); });
for (const b of document.querySelectorAll("[data-mode]"))
  b.addEventListener("click", () => {
    MODE = b.dataset.mode;
    for (const o of document.querySelectorAll("[data-mode]"))
      o.setAttribute("aria-pressed", String(o === b));
    applyFilters();
  });
$("#hide").addEventListener("click", () => {
  HIDE = !HIDE; $("#hide").setAttribute("aria-pressed", String(HIDE)); applyFilters();
});
$("#menu").addEventListener("click", () => {
  const p = $("#more"); const on = p.classList.toggle("hidden");
  $("#menu").setAttribute("aria-pressed", String(!on));
});

(async function init(){
  const saved = +localStorage.getItem("er-pid") || null;
  const ps = await loadProfiles(saved && !isNaN(saved) ? saved : null);
  if (!ps.some(p => p.id === PID)) PID = ps[0].id;
  await loadProfiles(PID);
  await loadTree();
})();
</script>
</body>
