<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9E6DC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15150F" media="(prefers-color-scheme: dark)">
<title>The Tarnished Ledger</title>
<style>
/* ── typefaces ─────────────────────────────────────────────────────────
   Self-hosted, built into the Nix store by service.nix. EB Garamond for
   headings, including its genuine small-capitals cut for labels — real
   small caps, not uppercase with letter-spacing bolted on. IBM Plex Sans
   for the interface, Plex Mono for figures.                            */
@font-face{font-family:Garamond;src:url(/fonts/garamond.woff2) format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:GaramondSC;src:url(/fonts/garamond-sc.woff2) format("woff2");
  font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(/fonts/plex.woff2) format("woff2");
  font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(/fonts/plex-medium.woff2) format("woff2");
  font-weight:500;font-display:swap}
@font-face{font-family:Plex;src:url(/fonts/plex-semibold.woff2) format("woff2");
  font-weight:600;font-display:swap}
@font-face{font-family:PlexMono;src:url(/fonts/plex-mono.woff2) format("woff2");
  font-weight:400;font-display:swap}

/* ── tokens ─────────────────────────────────────────────────────────── */
:root{
  --page:#E9E6DC;         /* parchment, greened slightly toward the accent */
  --field:#F3F1E9;        /* raised surface */
  --ink:#1E201A;
  --ink-soft:#4A4C43;
  --ink-faint:#7C7E71;
  --rule:#C6C4B6;         /* hairline */
  --rule-faint:#D8D6C9;
  --mark:#7C6413;         /* accent: gilding. used sparingly */
  --mark-lit:#A5871F;
  --shadow-realm:#584874; /* DLC */
  --forked:#8A2E24;       /* mutually exclusive */
  --settled:#4F6B3C;      /* satisfied automatically */

  --gap:16px;
  --tap:44px;             /* minimum comfortable touch target */
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --page:#15150F;
  --field:#1E1E17;
  --ink:#E9E5D6;
  --ink-soft:#BAB7A7;
  --ink-faint:#87857A;
  --rule:#32322A;
  --rule-faint:#282821;
  --mark:#D2B34F;
  --mark-lit:#E7CB6C;
  --shadow-realm:#A897D0;
  --forked:#D9776A;
  --settled:#93B577;
}}
:root[data-theme=dark]{
  --page:#15150F; --field:#1E1E17; --ink:#E9E5D6; --ink-soft:#BAB7A7;
  --ink-faint:#87857A; --rule:#32322A; --rule-faint:#282821;
  --mark:#D2B34F; --mark-lit:#E7CB6C; --shadow-realm:#A897D0;
  --forked:#D9776A; --settled:#93B577;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:Plex,system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
/* Nothing in this document is a rounded card. */
button,input,select{border-radius:0;font:inherit}

.sc{font-family:GaramondSC,Garamond,serif;font-size:1.05em;letter-spacing:.02em}

/* ── masthead ───────────────────────────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:30;background:var(--field);
  border-bottom:1px solid var(--rule);
  padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
}
.top-row{display:flex;align-items:center;gap:12px}
.mark{
  font-family:Garamond,serif;font-size:20px;line-height:1.1;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.score{margin-left:auto;display:flex;align-items:baseline;gap:6px;flex:none}
.score .pct{font-family:PlexMono,monospace;font-size:17px;font-variant-numeric:tabular-nums}
.score .of{font-family:PlexMono,monospace;font-size:11px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.gauge{height:2px;background:var(--rule);margin-top:8px;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--mark-lit);transition:width .25s}

.icon{
  flex:none;width:var(--tap);height:36px;margin:-4px -8px -4px 0;
  display:grid;place-items:center;background:none;border:0;color:var(--ink-soft);
  cursor:pointer;
}
.icon:hover{color:var(--mark)}
.icon svg{width:20px;height:20px}

.find{display:flex;align-items:center;gap:8px;margin-top:8px;
  border:1px solid var(--rule);background:var(--page);padding:0 10px;height:var(--tap)}
.find svg{width:15px;height:15px;flex:none;color:var(--ink-faint)}
.find input{flex:1;min-width:0;border:0;background:none;color:var(--ink);
  font-size:16px;outline:none;height:100%}  /* 16px keeps iOS from zooming */

/* control drawer: hidden on small screens until summoned */
.drawer{display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--rule-faint)}
.drawer.open{display:flex}
.btn{
  min-height:36px;padding:0 12px;background:var(--page);color:var(--ink-soft);
  border:1px solid var(--rule);cursor:pointer;font-size:14px;white-space:nowrap;
}
.btn:hover{border-color:var(--mark);color:var(--ink)}
.btn[aria-pressed=true]{background:var(--mark);border-color:var(--mark);color:var(--page)}
.btn:focus-visible,.find:focus-within,select:focus-visible,input:focus-visible{
  outline:2px solid var(--mark-lit);outline-offset:1px}
.pick{min-height:36px;padding:0 8px;background:var(--page);color:var(--ink);
  border:1px solid var(--rule);flex:1 1 160px;max-width:260px;min-width:0}
.split{display:flex;border:1px solid var(--rule)}
.split .btn{border:0;border-right:1px solid var(--rule)}
.split .btn:last-child{border-right:0}

/* ── section index: a horizontal band on phones, a column on desktop ── */
.index{
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  background:var(--page);border-top:1px solid var(--rule-faint);
  /* inside the sticky header, bled back out to the screen edges */
  margin:8px -12px 0;padding:0 12px;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
}
.index::-webkit-scrollbar{display:none}
.index a{
  flex:none;padding:10px 14px;text-decoration:none;color:var(--ink-soft);
  font-size:13px;white-space:nowrap;border-right:1px solid var(--rule-faint);
}
.index a .n{font-family:PlexMono,monospace;font-size:11px;color:var(--ink-faint);
  margin-left:6px;font-variant-numeric:tabular-nums}
.index a.full{color:var(--mark)}

.page{padding:0 max(12px,env(safe-area-inset-left)) 64px}

/* ── sections ───────────────────────────────────────────────────────── */
.part{padding-top:28px;scroll-margin-top:64px}
.part > h2{
  font-family:Garamond,serif;font-weight:400;font-size:29px;line-height:1.15;
  margin:0 0 2px;
}
.tally{font-family:PlexMono,monospace;font-size:12px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.tally b{color:var(--mark);font-weight:400}
.gloss{color:var(--ink-soft);font-size:14px;margin:8px 0 0;max-width:62ch;
  font-family:Garamond,serif;font-size:17px;line-height:1.45}
.part > hr{border:0;border-top:1px solid var(--rule);margin:14px 0 0}

.band{margin-top:22px}
.band > h3{
  margin:0 0 6px;font-weight:400;font-size:15px;color:var(--ink-soft);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.band > h3 .n{margin-left:auto;font-family:PlexMono,monospace;font-size:11px;
  color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tag{font-family:GaramondSC,serif;font-size:13px;padding:0 5px;line-height:1.5}
.tag.dlc{color:var(--shadow-realm);border:1px solid var(--shadow-realm)}
.tag.forked{color:var(--forked);border:1px solid var(--forked)}
.tag.settled{color:var(--ink-faint);border:1px dotted var(--rule)}

ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-faint)}
.row{border-bottom:1px solid var(--rule-faint)}
.row label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;
  padding:11px 4px;min-height:var(--tap)}
.row input[type=checkbox]{
  appearance:none;-webkit-appearance:none;flex:none;
  width:17px;height:17px;margin:2px 0 0;position:relative;cursor:pointer;
  border:1px solid var(--ink-faint);background:var(--field);
}
.row input:checked{background:var(--mark);border-color:var(--mark)}
.row input:checked::after{content:"";position:absolute;left:5px;top:1px;
  width:4px;height:9px;border:solid var(--field);border-width:0 2px 2px 0;
  transform:rotate(43deg)}
.row .what{min-width:0;font-size:15px;line-height:1.4}
.row .where{display:block;font-family:Garamond,serif;font-size:15px;line-height:1.35;
  color:var(--ink-faint);margin-top:2px}
.row input:checked ~ .what{color:var(--ink-faint)}
.row input:checked ~ .what > .name{text-decoration:line-through;
  text-decoration-color:var(--rule)}

/* automatic rows: outcome of something else, so not directly tickable */
.row[data-auto] label{cursor:default}
.row[data-auto] input{cursor:default;border-style:dotted;background:transparent}
.row[data-auto] input:checked{background:var(--settled);border-color:var(--settled);
  border-style:solid}
.row[data-auto] .what{color:var(--ink-faint)}
.seen{font-family:PlexMono,monospace;font-size:11px;color:var(--mark);margin-left:6px}

/* tallies */
.count{display:flex;align-items:center;gap:10px;padding:8px 4px;min-height:var(--tap)}
.count .what{flex:1;min-width:0;font-size:15px}
.count .num{font-family:PlexMono,monospace;font-size:15px;font-variant-numeric:tabular-nums;
  color:var(--ink-soft);min-width:56px;text-align:right}
.count .num b{color:var(--mark);font-weight:400}
.count button{width:36px;height:36px;flex:none;background:var(--page);
  border:1px solid var(--rule);color:var(--ink-soft);cursor:pointer;font-size:17px;
  line-height:1}
.count button:hover{border-color:var(--mark);color:var(--mark)}
.count.done .num b{color:var(--settled)}

/* ── notices ────────────────────────────────────────────────────────── */
.notice{margin-top:22px;padding:14px 0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
.notice h3{font-family:Garamond,serif;font-weight:400;font-size:19px;margin:0 0 4px}
.notice p{margin:0 0 10px;color:var(--ink-soft);font-size:14px;max-width:62ch}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap}
.gone{display:none!important}
.nil{color:var(--ink-faint);font-family:Garamond,serif;font-size:18px;padding:40px 4px}

.flash{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--page);padding:9px 15px;font-size:14px;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw}
.flash.up{opacity:1}

/* ── wider screens ──────────────────────────────────────────────────── */
@media (min-width:760px){
  body{font-size:15px}
  .top{padding:10px 24px}
  .mark{font-size:23px}
  .find{margin-top:0;flex:1 1 260px;max-width:340px;height:36px}
  .top-row{flex-wrap:wrap;gap:14px}
  .icon{display:none}
  .drawer{display:flex;margin-top:0;padding-top:0;border-top:0;flex:1 1 100%}
  .gauge{margin-top:10px}
  .page{display:flex;gap:36px;max-width:1360px;margin:0 auto;
        padding:0 24px 80px;align-items:flex-start}
  .index{
    position:sticky;top:96px;display:block;flex:0 0 196px;overflow:visible;
    border-top:0;border-right:1px solid var(--rule-faint);background:none;
    margin:28px 0 0;padding:0 14px 0 0;
    max-height:calc(100vh - 120px);overflow-y:auto;
  }
  .index a{display:flex;justify-content:space-between;gap:8px;padding:5px 0;
    border-right:0;border-bottom:1px solid var(--rule-faint)}
  .index a .n{margin-left:0}
  .body{flex:1 1 auto;min-width:0}
  .part:first-child{padding-top:24px}
  ul.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));
    column-gap:26px;border-top:0}
  ul.list.roomy{grid-template-columns:repeat(auto-fill,minmax(460px,1fr))}
  .row label{padding:6px 2px;min-height:0}
  .count{padding:6px 2px;min-height:0}
}
@media (min-width:1080px){ .part > h2{font-size:34px} }

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1 class="mark">The Tarnished Ledger</h1>
    <div class="score">
      <span class="pct" id="pct">—</span>
      <span class="of" id="of"></span>
    </div>
    <button class="icon" id="more" aria-label="Show controls" aria-expanded="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
  </div>
  <label class="find">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L15 15"/></svg>
    <input id="q" type="search" placeholder="Search the ledger" aria-label="Search">
  </label>
  <div class="drawer" id="drawer">
    <select class="pick" id="run" aria-label="Active run"></select>
    <div class="split" role="group" aria-label="Filter by content">
      <button class="btn" data-scope="all" aria-pressed="true">All</button>
      <button class="btn" data-scope="base" aria-pressed="false">Base</button>
      <button class="btn" data-scope="dlc" aria-pressed="false">Shadow</button>
    </div>
    <button class="btn" id="veil" aria-pressed="false">Hide done</button>
    <button class="btn" id="union" aria-pressed="false">Across runs</button>
    <button class="btn" id="admin">Runs&hellip;</button>
  </div>
  <nav class="index" id="index" aria-label="Sections"></nav>
  <div class="gauge"><i id="gauge"></i></div>
</header>

<div class="page">
  <nav class="index gone" id="index-wide" aria-hidden="true"></nav>
  <main class="body">
    <section class="notice gone" id="panel">
      <h3>This run</h3>
      <p id="panel-text"></p>
      <div class="acts">
        <button class="btn" id="new">New run</button>
        <button class="btn" id="rename">Rename</button>
        <button class="btn" id="save">Export</button>
        <button class="btn" id="load">Import</button>
        <button class="btn" id="wipe">Clear ticks</button>
        <button class="btn" id="drop">Delete run</button>
      </div>
    </section>
    <section class="notice gone" id="union-panel">
      <h3>Across every run</h3>
      <p id="union-text"></p>
    </section>
    <div id="out"></div>
    <p class="nil gone" id="nil">Nothing here matches.</p>
  </main>
</div>
<div class="flash" id="flash"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const api = async (p,o) => {
  const r = await fetch(p,o);
  const j = await r.json().catch(()=>({error:"unreadable response"}));
  if (j.error){ flash(j.error); throw new Error(j.error); }
  return j;
};
let flashT;
function flash(m){ const f=$("#flash"); f.textContent=m; f.classList.add("up");
  clearTimeout(flashT); flashT=setTimeout(()=>f.classList.remove("up"),2400); }

let RUN=null, PARTS=[], SCOPE="all", VEIL=false, UNION=false, Q="", DONE_ANY={};

/* ── build ─────────────────────────────────────────────────────────── */
function draw(){
  let nav="", html="";
  for (const p of PARTS){
    nav += `<a href="#p-${p.slug}" data-nav="${p.slug}">
      <span>${esc(p.title)}</span><span class="n" data-pc="${p.slug}"></span></a>`;
    let bands="";
    for (const b of p.groups){
      const tags = (b.dlc?'<span class="tag dlc">Shadow</span>':"")
                 + (b.choice?'<span class="tag forked">either / or</span>':"");
      let rows="";
      for (const it of b.items){
        const hay = (it.name+" "+it.detail).toLowerCase();
        const at = `data-id="${it.id}" data-dlc="${b.dlc}" data-cap="${it.target}" data-hay="${esc(hay)}"`;
        if (it.kind === "tally"){
          rows += `<li class="row" ${at} data-kind="tally">
            <div class="count${it.value>=it.target?" done":""}">
              <button type="button" data-step="-1" data-id="${it.id}"
                aria-label="Fewer ${esc(it.name)}">&minus;</button>
              <button type="button" data-step="1" data-id="${it.id}"
                aria-label="More ${esc(it.name)}">+</button>
              <span class="what"><span class="name">${esc(it.name)}</span>
                ${it.detail?`<span class="where">${esc(it.detail)}</span>`:""}</span>
              <span class="num"><b>${it.value}</b>/${it.target}</span>
            </div></li>`;
        } else {
          const auto = it.derived;
          const note = auto
            ? `<span class="where">Settled by ${esc(it.from)}${it.detail?" &middot; "+esc(it.detail):""}</span>`
            : (it.detail?`<span class="where">${esc(it.detail)}</span>`:"");
          rows += `<li class="row" ${at}${auto?' data-auto="1"':""} data-kind="check"><label>
            <input type="checkbox" data-id="${it.id}"${it.value?" checked":""}${auto?" disabled":""}>
            <span class="what"><span class="name">${esc(it.name)}</span>${
              auto?' <span class="tag settled">auto</span>':""}${
              it.runs>1?`<span class="seen">${it.runs}&times;</span>`:""}${note}</span>
            </label></li>`;
        }
      }
      bands += `<div class="band"><h3>${esc(b.name)}${tags}
        <span class="n" data-bc="${b.id}"></span></h3>
        <ul class="list${p.slug==="quest"?" roomy":""}">${rows}</ul></div>`;
    }
    html += `<section class="part" id="p-${p.slug}" data-part="${p.slug}">
      <h2>${esc(p.title)}</h2>
      <div class="tally" data-ptc="${p.slug}"></div>
      ${p.note?`<p class="gloss">${esc(p.note)}</p>`:""}
      <hr>${bands}</section>`;
  }
  $("#index").innerHTML = nav;
  $("#index-wide").innerHTML = nav;
  $("#out").innerHTML = html;
  recount(); sift();
}

/* count locally so a tap feels instant */
function recount(){
  let all=0, got=0;
  for (const part of document.querySelectorAll(".part")){
    let a=0,g=0;
    for (const row of part.querySelectorAll(".row")){
      const cap=+row.dataset.cap; a+=cap;
      g += row.dataset.kind==="tally"
        ? +row.querySelector(".num b").textContent
        : (row.querySelector("input").checked ? cap : 0);
    }
    all+=a; got+=g;
    const slug=part.dataset.part, frac = a? g/a : 0;
    const t=$(`[data-ptc="${slug}"]`); if(t) t.innerHTML=`<b>${g}</b> of ${a}`;
    for (const el of document.querySelectorAll(`[data-pc="${slug}"]`))
      el.textContent = Math.round(frac*100)+"%";
    for (const el of document.querySelectorAll(`[data-nav="${slug}"]`))
      el.classList.toggle("full", g===a && a>0);
    for (const band of part.querySelectorAll(".band")){
      let x=0,y=0;
      for (const row of band.querySelectorAll(".row")){
        const cap=+row.dataset.cap; y+=cap;
        x += row.dataset.kind==="tally"
          ? +row.querySelector(".num b").textContent
          : (row.querySelector("input").checked ? cap : 0);
      }
      band.querySelector("h3 .n").textContent = `${x}/${y}`;
    }
  }
  const frac = all? got/all : 0;
  $("#pct").textContent = (frac*100).toFixed(1)+"%";
  $("#of").textContent = `${got}/${all}`;
  $("#gauge").style.width = (frac*100).toFixed(2)+"%";
}

/* ── filtering ─────────────────────────────────────────────────────── */
function sift(){
  let anything=false;
  for (const part of document.querySelectorAll(".part")){
    let partOn=false;
    for (const band of part.querySelectorAll(".band")){
      let bandOn=false;
      for (const row of band.querySelectorAll(".row")){
        const dlc = row.dataset.dlc==="1";
        const full = row.dataset.kind==="tally"
          ? +row.querySelector(".num b").textContent >= +row.dataset.cap
          : row.querySelector("input").checked;
        let show = true;
        if (SCOPE==="base" && dlc) show=false;
        if (SCOPE==="dlc" && !dlc) show=false;
        if (show && VEIL && full) show=false;
        if (show && UNION && DONE_ANY[row.dataset.id]) show=false;
        if (show && Q && !row.dataset.hay.includes(Q)) show=false;
        row.classList.toggle("gone", !show);
        if (show) bandOn=true;
      }
      band.classList.toggle("gone", !bandOn);
      if (bandOn) partOn=true;
    }
    part.classList.toggle("gone", !partOn);
    if (partOn) anything=true;
    for (const el of document.querySelectorAll(`[data-nav="${part.dataset.part}"]`))
      el.classList.toggle("gone", !partOn);
  }
  $("#nil").classList.toggle("gone", anything);
}

/* ── writes ────────────────────────────────────────────────────────── */
async function put(id, value){
  const j = await api("/api/set",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({profile:RUN,item:id,value})});
  if (j.derived) paintAuto(j.derived);
  return j.value;
}
function paintAuto(map){
  for (const [id,v] of Object.entries(map)){
    const box = document.querySelector(`.row[data-id="${id}"] input[type=checkbox]`);
    if (box) box.checked = v>0;
  }
}

document.addEventListener("change", async e => {
  const box = e.target.closest('input[type=checkbox][data-id]');
  if (!box) return;
  const row = box.closest(".row");
  try { await put(+box.dataset.id, box.checked ? +row.dataset.cap : 0); }
  catch { box.checked = !box.checked; }
  recount(); sift();
});

document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-step]");
  if (!b) return;
  const row=b.closest(".row"), n=row.querySelector(".num b"), cap=+row.dataset.cap;
  const was=+n.textContent, now=Math.max(0,Math.min(cap,was+(+b.dataset.step)));
  if (now===was) return;
  n.textContent=now;
  row.querySelector(".count").classList.toggle("done", now>=cap);
  recount(); sift();
  try { await put(+b.dataset.id, now); }
  catch { n.textContent=was; recount(); sift(); }
});

/* ── runs ──────────────────────────────────────────────────────────── */
async function loadRuns(want){
  const {profiles} = await api("/api/profiles");
  const sel=$("#run");
  sel.innerHTML = profiles.map(p =>
    `<option value="${p.id}"${p.id===want?" selected":""}>${esc(p.name)} — ${p.done}/${p.total}</option>`).join("");
  RUN = want ?? +sel.value;
  const cur = profiles.find(p=>p.id===RUN);
  if (cur) $("#panel-text").textContent =
    `${cur.name}. Started ${cur.created_at}. ${cur.done} of ${cur.total} settled.`;
  return profiles;
}
async function loadTree(){
  const j = await api("/api/tree?profile="+RUN);
  PARTS = j.sections; draw();
}

$("#run").addEventListener("change", async e => {
  RUN=+e.target.value; localStorage.setItem("er-run",RUN);
  await loadRuns(RUN); await loadTree();
  if (UNION) await loadUnion();
  sift();
});
$("#new").addEventListener("click", async () => {
  const name = prompt('Name this run (e.g. "NG+2 — Frenzied Flame")'); if(!name) return;
  const j = await api("/api/profiles",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
  RUN=j.id; localStorage.setItem("er-run",RUN);
  await loadRuns(RUN); await loadTree(); flash("Run created");
});
$("#rename").addEventListener("click", async () => {
  const name=prompt("New name"); if(!name) return;
  await api("/api/profiles/rename",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:RUN,name})});
  await loadRuns(RUN); flash("Renamed");
});
$("#drop").addEventListener("click", async () => {
  if(!confirm("Delete this run and everything ticked in it?")) return;
  const j = await api("/api/profiles/delete",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:RUN})});
  RUN=j.profiles[0].id; localStorage.setItem("er-run",RUN);
  await loadRuns(RUN); await loadTree(); flash("Run deleted");
});
$("#wipe").addEventListener("click", async () => {
  if(!confirm("Clear every tick in this run? The run itself stays.")) return;
  await api("/api/reset",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:RUN})});
  await loadRuns(RUN); await loadTree(); flash("Run cleared");
});
$("#save").addEventListener("click", async () => {
  const j = await api("/api/export?profile="+RUN);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(j,null,1)],{type:"application/json"}));
  a.download=`ledger-${j.profile.replace(/\W+/g,"-").toLowerCase()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
});
$("#load").addEventListener("click", () => {
  const f=document.createElement("input"); f.type="file"; f.accept=".json,application/json";
  f.onchange=()=>{ const file=f.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=async()=>{ try{
      const d=JSON.parse(r.result);
      const j=await api("/api/import",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({profile:RUN,progress:d.progress||[]})});
      await loadRuns(RUN); await loadTree();
      flash(`Imported ${j.imported}${j.derived_skipped?`, ${j.derived_skipped} now automatic`:""}`);
    }catch{ flash("That file is not a ledger export"); } };
    r.readAsText(file); };
  f.click();
});

/* ── across runs ───────────────────────────────────────────────────── */
async function loadUnion(){
  const j = await api("/api/coverage");
  const short = new Set(j.missing.map(m=>m.item_id));
  DONE_ANY={};
  for (const p of PARTS) for (const b of p.groups) for (const it of b.items)
    DONE_ANY[it.id] = !short.has(it.id);
  $("#union-text").textContent =
    `${j.done} of ${j.total} settled in at least one run. `+
    `${j.missing.length} entries have never been settled in any run — those are what is listed below.`;
}
$("#union").addEventListener("click", async () => {
  UNION=!UNION;
  $("#union").setAttribute("aria-pressed",String(UNION));
  $("#union-panel").classList.toggle("gone",!UNION);
  if (UNION) await loadUnion();
  sift();
});

/* ── controls ──────────────────────────────────────────────────────── */
$("#q").addEventListener("input", e => { Q=e.target.value.trim().toLowerCase(); sift(); });
for (const b of document.querySelectorAll("[data-scope]"))
  b.addEventListener("click", () => {
    SCOPE=b.dataset.scope;
    for (const o of document.querySelectorAll("[data-scope]"))
      o.setAttribute("aria-pressed",String(o===b));
    sift();
  });
$("#veil").addEventListener("click", () => {
  VEIL=!VEIL; $("#veil").setAttribute("aria-pressed",String(VEIL)); sift(); });
$("#more").addEventListener("click", () => {
  const open = $("#drawer").classList.toggle("open");
  $("#more").setAttribute("aria-expanded",String(open));
});
$("#admin").addEventListener("click", () => {
  const shown = !$("#panel").classList.toggle("gone");
  if (shown) $("#panel").scrollIntoView({block:"nearest"});
});

/* one index element at a time: the band on phones, the column on desktop */
const wide = window.matchMedia("(min-width:760px)");
function placeIndex(){
  $("#index").classList.toggle("gone", wide.matches);
  $("#index-wide").classList.toggle("gone", !wide.matches);
  $("#index-wide").setAttribute("aria-hidden", String(!wide.matches));
  $("#index").setAttribute("aria-hidden", String(wide.matches));
}
wide.addEventListener("change", placeIndex);

(async function start(){
  placeIndex();
  const saved = +localStorage.getItem("er-run") || null;
  const runs = await loadRuns(saved || null);
  if (!runs.some(p=>p.id===RUN)){ RUN=runs[0].id; await loadRuns(RUN); }
  await loadTree();
  // the tree renders after load, so an incoming #section anchor has nothing
  // to find until now
  if (location.hash){
    const t = document.querySelector(location.hash);
    if (t) t.scrollIntoView();
  }
})();
</script>
